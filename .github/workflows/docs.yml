name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"

jobs:
  links-and-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check forbidden audio assets
        shell: bash
        run: |
          if find . -type f \( -name "*.mp3" -o -name "*.wav" -o -name "*.m4a" -o -name "*.flac" \) | grep .; then
            echo "Raw audio files are not allowed in this repository."
            exit 1
          fi

