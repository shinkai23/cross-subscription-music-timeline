services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music_timeline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music_timeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/api
    environment:
      DATABASE_URL: postgresql+psycopg://music:music@postgres:5432/music_timeline
      JWT_SECRET: local-development-secret
      ENVIRONMENT: local
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
